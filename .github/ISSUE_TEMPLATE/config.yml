blank_issues_enabled: false
contact_links:
  - name: Report a vulnerability
    url: https://github.com/justpilot/billomat-php-api/security/policy
    about: Please do NOT open an issue for security findings. Email dimitri@justpilot.io instead; details in SECURITY.md.
  - name: Billomat API question or bug
    url: https://www.billomat.com/kontakt/
    about: Questions or bugs in the Billomat API itself (not in this SDK) go directly to Billomat.
  - name: General questions / discussion
    url: https://github.com/justpilot/billomat-php-api/discussions
    about: Open questions, best practices or ideas without a concrete issue.
