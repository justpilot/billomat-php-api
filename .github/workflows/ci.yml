name: CI

on:
  pull_request:
  push:
    branches: [main, 4.x]

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.5'
            symfony: '8.1.*'
            name: 'Tests (PHP 8.5, Symfony 8.1)'
          - php: '8.5'
            symfony: '^8.1'
            name: 'Tests (PHP 8.5, Symfony 8.x)'
          - php: '8.6'
            symfony: '^8.1'
            experimental: true
            name: 'Tests (PHP 8.6, Symfony 8.x)'
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath
          coverage: xdebug
          tools: composer:v2, flex
          ini-values: memory_limit=512M

      - name: Pin Symfony version (${{ matrix.symfony }})
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex
          composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run unit tests
        run: composer test:unit

  compat-guzzle:
    name: PSR-18 compat (Guzzle, no Symfony)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          working-directory: .github/compat/guzzle
          dependency-versions: highest

      - name: Run smoke test
        working-directory: .github/compat/guzzle
        run: php smoke.php

  quality:
    name: Static Analysis & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath
          tools: composer:v2
          ini-values: memory_limit=512M

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: PHP-CS-Fixer (lint)
        run: composer lint

      - name: PHPStan (analyse)
        run: composer analyse

      - name: Rector (dry-run)
        run: composer refactor:dry

      - name: Generated code up to date
        run: composer generate:check

      - name: Composer audit
        run: composer audit

  bc-check:
    name: Backward compatibility
    runs-on: ubuntu-latest
    # Bis 4.0.0-beta.1 nur zur Information; ab der Beta bricht der Job bei jedem BC-Bruch ab.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Das Tool vergleicht Git-Referenzen und braucht dafür Historie und Tags.
          fetch-depth: 0

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath
          tools: composer:v2

      # Eigenes Verzeichnis statt require-dev: Das Tool braucht symfony/console 7, wir sind auf Symfony 8.
      - name: Install roave/backward-compatibility-check
        run: composer global require --no-progress roave/backward-compatibility-check:^8.26

      - name: Compare against the latest 4.x tag
        run: |
          base=$(git -c versionsort.suffix=- tag --list 'v4.*' --sort=-v:refname | head -n 1)
          echo "Comparing against ${base}"
          "$(composer global config bin-dir --absolute)/roave-backward-compatibility-check" --from="${base}" --format=github-actions

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # PRs mutieren nur die geänderten Zeilen und brauchen dafür den Basis-Branch.
          fetch-depth: 0

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath
          coverage: xdebug
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run Infection on changed lines
        if: github.event_name == 'pull_request'
        run: composer mutate -- --logger-github --git-diff-lines --git-diff-base=origin/${{ github.base_ref }} --min-msi=90 --min-covered-msi=90 --ignore-msi-with-no-mutations

      - name: Run Infection on all code
        if: github.event_name == 'push'
        run: composer mutate -- --logger-github
        env:
          INFECTION_BADGE_API_KEY: ${{ secrets.INFECTION_BADGE_API_KEY }}
