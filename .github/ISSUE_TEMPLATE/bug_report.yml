name: Bug report
description: Report a bug in the SDK
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more complete the form, the faster we can find the cause.

        **Before you report, please check:**
        - The bug is in `justpilot/billomat-php-api`, not in the Billomat API itself (please report Billomat problems to https://www.billomat.com/).
        - It's not a security issue; for those, follow `SECURITY.md` and send an email instead.

  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: Which version of `justpilot/billomat-php-api` is installed?
      placeholder: "e.g. 4.0.0"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "e.g. 8.5.1"
    validations:
      required: true

  - type: input
    id: http-client
    attributes:
      label: PSR-18 HTTP client
      description: "Which client and version, e.g. from `composer show symfony/http-client` or `composer show guzzlehttp/guzzle`"
      placeholder: "e.g. symfony/http-client 8.1.0"
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A minimal code snippet that triggers the bug. Please redact API keys and personal data.
      render: php
      placeholder: |
        $billomat = BillomatClient::create(billomatId: '...', apiKey: '...');
        $billomat->invoices->complete(123);
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: If an exception is thrown, please include its class and message.
    validations:
      required: true

  - type: textarea
    id: stack-trace
    attributes:
      label: Stack trace / logs (optional)
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context (optional)
      description: Anything that could help, e.g. workarounds, hypotheses, related issues.
