name: Feature request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion. Please describe not only **what** you need but also **why**; the concrete use case helps us find the right API.

        **Before you suggest something, please check:**
        - The endpoint exists in the Billomat API (see https://www.billomat.com/api/). The SDK can't cover what Billomat doesn't offer; for example, webhook subscriptions can only be managed in the Billomat UI (see `docs/concepts/webhooks.md`).

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Which problem do you want to solve? Example code of how the call could look is welcome.
    validations:
      required: true

  - type: input
    id: billomat-endpoint
    attributes:
      label: Billomat API endpoint
      description: Which Billomat endpoint covers this? Please link it from https://www.billomat.com/api/.
      placeholder: "https://www.billomat.com/api/rechnungen/"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal (optional)
      description: Suggested SDK signature, class names, behaviour. See the three-layer pattern (`*Api`, `*CreateOptions`, `Model\*`) in `AGENTS.md`.
      render: php

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered (optional)

  - type: textarea
    id: additional
    attributes:
      label: Additional context (optional)
