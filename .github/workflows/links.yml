name: Links

on:
  pull_request:
    paths: ['**.md', 'docs/**', 'src/**', 'tools/codegen/definitions/**', 'lychee.toml', '.github/workflows/links.yml']
  push:
    branches: [4.x]
    paths: ['**.md', 'docs/**', 'src/**', 'tools/codegen/definitions/**', 'lychee.toml', '.github/workflows/links.yml']
  # Wöchentlich, damit auch Links auffallen, die ohne Änderung bei uns kaputtgehen.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      # Konfiguration in lychee.toml; das Token verhindert das GitHub-Rate-Limit für github.com-Links.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --config lychee.toml 'docs/**/*.md' '*.md' 'src/**/*.php' 'tools/codegen/definitions/*.php'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
